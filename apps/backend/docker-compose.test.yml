services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${TEST_DATABASE_NAME:-folder_security_test}
      POSTGRES_USER: ${TEST_DATABASE_USER:-test}
      POSTGRES_PASSWORD: ${TEST_DATABASE_PASSWORD:-test-only-password}
    ports:
      - "${TEST_DATABASE_PORT:-5433}:5432"
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${TEST_DATABASE_USER:-test} -d ${TEST_DATABASE_NAME:-folder_security_test}
      interval: 5s
      timeout: 5s
      retries: 12
