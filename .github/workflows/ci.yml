name: 持续验证 / Continuous Verification

on:
  pull_request:
  push:
    branches:
      - main
      - develop
      - 'feature/**'

permissions:
  contents: read

jobs:
  public-source:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Audit public source examples
        run: .\scripts\audit-public-source.ps1

  backend:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache-dependency-path: apps/backend/go.sum
      - run: go test ./...

  web:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:static

  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test .\apps\desktop-win.tests\OpenAD.Desktop.Tests.csproj -c Release
      - run: dotnet build .\apps\desktop-win\OpenAD.Desktop.csproj -c Release
