version: '3.8'

services:
  permission-protector:
    build:
      context: .
      dockerfile: Dockerfile.windows
    ports:
      - "3000:3000"
      - "8080:8080"
    volumes:
      - type: bind
        # Set OPENAD_SCAN_ROOT to one folder or share that the container may scan.
        source: "${OPENAD_SCAN_ROOT:?Set OPENAD_SCAN_ROOT to the folder to scan}"
        target: C:\host
        read_only: true
    environment:
      - DATABASE_URL=sqlite:///app/data/OpenAD.db
    restart: unless-stopped

  # Alternative Linux-based service for cross-platform
  analyzer-linux:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3001:3000"
      - "8081:8080"
    volumes:
      - ./data:/app/data
    environment:
      - DATABASE_URL=sqlite:///app/data/OpenAD.db
    restart: unless-stopped
    profiles: ["linux"]
