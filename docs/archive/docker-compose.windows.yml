# 历史部署配置，已归档，不属于当前 OpenAD 交付路径。
# Archived deployment configuration. It is not supported by the current OpenAD release.
# The original file is retained here for historical reference only.

version: '3.8'

services:
  permission-protector:
    build:
      context: ../..
      dockerfile: Dockerfile.windows
    ports:
      - "3000:3000"
      - "8080:8080"
    volumes:
      - type: bind
        source: "${OPENAD_SCAN_ROOT:?Set OPENAD_SCAN_ROOT to the folder to scan}"
        target: C:\host
        read_only: true
    environment:
      - DATABASE_URL=sqlite:///app/data/OpenAD.db
    restart: unless-stopped

  analyzer-linux:
    build:
      context: ../..
      dockerfile: Dockerfile
    ports:
      - "3001:3000"
      - "8081:8080"
    volumes:
      - ../../data:/app/data
    environment:
      - DATABASE_URL=sqlite:///app/data/OpenAD.db
    restart: unless-stopped
    profiles: ["linux"]
